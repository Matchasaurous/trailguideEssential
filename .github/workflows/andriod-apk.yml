# Builds the Trailguard Essentials Android app (APK) on GitHub's servers — no laptop
# or Android Studio needed. Run it from the repository's Actions tab:
# "Build Android APK" → Run workflow. The APK appears under the run's Artifacts.
#
# Needs one repository secret (Settings → Secrets and variables → Actions):
#   TRAILGUARD_CONFIG_JS  — the whole contents of your trailguard-config.js
# Optional, for an APK that installs over the previous one (same signature):
#   TG_KEYSTORE_BASE64, TG_KEYSTORE_PASSWORD, TG_KEY_ALIAS, TG_KEY_PASSWORD
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # If the project was uploaded as a zip (trailguard-essentials-*.zip in the
      # repository), unpack it over the checkout so every file is present.
      - name: Unpack the project zip (if uploaded)
        run: |
          zip=$(ls trailguard-essentials-*.zip 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$zip" ]; then
            echo "Using $zip"
            rm -rf "$RUNNER_TEMP/tg" && mkdir -p "$RUNNER_TEMP/tg"
            unzip -q -o "$zip" -d "$RUNNER_TEMP/tg"
            # The newest project zip wins over older loose files in the repository.
            cp -a "$RUNNER_TEMP/tg/trailguard/." .
          fi
          test -f package.json || { echo "::error::package.json is missing — upload the project files or the project zip."; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME) with
      # its licences accepted; the Android build downloads any missing platform.

      - name: App settings (Firebase, Apps Script)
        env:
          TRAILGUARD_CONFIG_JS: ${{ secrets.TRAILGUARD_CONFIG_JS }}
        run: |
          if [ -z "$TRAILGUARD_CONFIG_JS" ]; then
            echo "::error::Add the repository secret TRAILGUARD_CONFIG_JS (the contents of your trailguard-config.js) and run again."
            exit 1
          fi
          printf '%s\n' "$TRAILGUARD_CONFIG_JS" > public/trailguard-config.js
          # Stop now (not after a 5-minute build) if a setting the app needs is blank. Values are never printed.
          node -e '
            global.window = {};
            require(require("path").resolve("public/trailguard-config.js"));
            const c = window.TRAILGUARD_CONFIG || {}, f = c.firebase || {};
            const empty = ["apiKey", "authDomain", "databaseURL", "projectId", "appId"].filter((k) => !String(f[k] || "").trim()).map((k) => "firebase." + k);
            if (!String(c.gasEndpoint || "").trim()) console.log("::warning::gasEndpoint is blank: Drive archiving and background alerts will not work in this APK.");
            if (empty.length) { console.log("::error::The TRAILGUARD_CONFIG_JS secret has blank settings: " + empty.join(", ") + ". Paste the whole filled-in trailguard-config.js into the secret and run again."); process.exit(1); }
            console.log("App settings: all Firebase fields are filled in.");
          '

      # App icon and splash screen from your logo. Uses app-logo.png from the top
      # of the repository if you uploaded one, otherwise the logo your website
      # shows (icons/icon-512.png on the app site), so one logo serves both.
      - name: App icon and splash from your logo
        env:
          LOGO_URL: https://app.trailguardessentials.com/icons/icon-512.png
        run: |
          logo="$RUNNER_TEMP/logo.png"
          if [ -f app-logo.png ]; then
            cp app-logo.png "$logo"; echo "Logo: app-logo.png from the repository"
          elif curl -fsSL "$LOGO_URL" -o "$logo"; then
            echo "Logo: $LOGO_URL"
          else
            echo "::warning::No logo found (no app-logo.png, and $LOGO_URL did not load). Keeping the icons in the project."
            exit 0
          fi
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          if [ ! -f scripts/make-icons.py ]; then
            # Project zips before 1.4.6 do not carry the icon script yet.
            mkdir -p scripts
            cat > scripts/make-icons.py <<'PY'
          #!/usr/bin/env python3
          """Make every app icon from one logo picture.

              python3 scripts/make-icons.py path/to/logo.png

          Writes
            assets/logo.png              1024 x 1024, for the Android icon and splash
                                         (npx @capacitor/assets generate --android)
            public/icons/icon-192.png    web app / install icons
            public/icons/icon-512.png
            public/icons/icon-maskable-512.png   (white background, logo inside the safe zone)
            public/icons/apple-touch-icon.png    (180 x 180, white background)
            public/icons/logo.svg, favicon.svg   (the logo, embedded)

          The logo may be any size (512 px or more is best) with a transparent or plain
          background; empty margins are trimmed and the logo is centred.
          Needs Pillow (pip install pillow).
          """
          import base64
          import io
          import sys
          from pathlib import Path

          from PIL import Image

          ROOT = Path(__file__).resolve().parent.parent


          def trimmed(img):
              img = img.convert('RGBA')
              box = img.getchannel('A').getbbox()
              if box and box != (0, 0, img.width, img.height):
                  img = img.crop(box)
              elif not box:
                  raise SystemExit('The logo is completely transparent.')
              return img


          def placed(logo, size, fill, background=None):
              """logo centred on a size x size canvas, its longer side `fill` of the canvas."""
              canvas = Image.new('RGBA', (size, size), background or (0, 0, 0, 0))
              scale = size * fill / max(logo.width, logo.height)
              w, h = max(1, round(logo.width * scale)), max(1, round(logo.height * scale))
              canvas.alpha_composite(logo.resize((w, h), Image.LANCZOS), ((size - w) // 2, (size - h) // 2))
              return canvas


          def main():
              if len(sys.argv) != 2:
                  raise SystemExit(__doc__)
              logo = trimmed(Image.open(sys.argv[1]))
              icons = ROOT / 'public' / 'icons'
              icons.mkdir(parents=True, exist_ok=True)
              (ROOT / 'assets').mkdir(exist_ok=True)
              white = (255, 255, 255, 255)

              placed(logo, 1024, 0.52).save(ROOT / 'assets' / 'logo.png')
              placed(logo, 512, 0.92).save(icons / 'icon-512.png')
              placed(logo, 192, 0.92).save(icons / 'icon-192.png')
              placed(logo, 512, 0.62, white).convert('RGB').save(icons / 'icon-maskable-512.png')
              placed(logo, 180, 0.80, white).convert('RGB').save(icons / 'apple-touch-icon.png')

              buf = io.BytesIO()
              placed(logo, 256, 1.0).save(buf, 'PNG', optimize=True)
              data = base64.b64encode(buf.getvalue()).decode('ascii')
              svg = ('<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256">'
                     f'<image width="256" height="256" href="data:image/png;base64,{data}" xlink:href="data:image/png;base64,{data}"/></svg>\n')
              (icons / 'logo.svg').write_text(svg)
              (icons / 'favicon.svg').write_text(svg)
              print(f'Icons made from {sys.argv[1]} ({logo.width}x{logo.height} after trimming).')


          if __name__ == '__main__':
              main()
          PY
          fi
          python3 scripts/make-icons.py "$logo"
          npx -y @capacitor/assets@3 generate --android \
            --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' \
            --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#0b1014'

      - name: Build the web app and copy it into Android
        run: |
          npm ci
          npm run cap:sync

      - name: Signing key (optional)
        env:
          TG_KEYSTORE_BASE64: ${{ secrets.TG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$TG_KEYSTORE_BASE64" ]; then
            printf '%s' "$TG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/trailguard-release.jks"
            echo "TG_KEYSTORE_FILE=$RUNNER_TEMP/trailguard-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        working-directory: android
        env:
          TG_KEYSTORE_PASSWORD: ${{ secrets.TG_KEYSTORE_PASSWORD }}
          TG_KEY_ALIAS: ${{ secrets.TG_KEY_ALIAS }}
          TG_KEY_PASSWORD: ${{ secrets.TG_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          if [ -n "$TG_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: trailguard-essentials-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
